# Android default settings (bbport.default.ini). The app applies them on a first install and once
# when updating from before 0.8.0 (settings_defaults in SettingsDefaults.java); later updates keep
# the player's settings. The graphics baseline remains conservative and portable; device-specific
# runtime tuning is selected separately. This branch defaults to the balanced FEX profile so x86
# memory ordering is preserved while reduced x87 precision keeps most of the fast profile's speed.
# SM8475 performance baseline: FSR 3.1 at 426x240, lowest model LOD, costly effects off,
# 30 FPS cap, normal renderer synchronization, automatic GPU governor. Lossless Scaling and
# cheats start off.
upscaler=fsr3
preset=4
output_res=1280x720
live_resolution=0
sharpen=0
sharpness=0.60
object_motion=0
show_fps=1
effect_chromatic_aberration=0
effect_dof=0
effect_motion_blur=0
effect_ssao=0
effect_game_aa=0
effect_dynamic_shadows=0
effect_ssr=0
skip_intro=1
debug_camera=0
debug_menu=0
mouse_look=0
jitter=1
reactive=0
reactive_scale=1.00
reactive_threshold=0.20
reactive_max=0.90
debug_view=0
fsr4_auto_exposure=1
fsr4_invert_jitter=0
model_lod=2
fps_limit=30
thor_cpus=
fex_profile=balanced
performance_profile=sustained
gpu_power=auto
renderer_sync=normal
frame_generation=0
lsfg_multiplier=0
lsfg_flow_scale=0.75
lsfg_performance=1
cheat_health=0
cheat_items=0

# SDL names describe positions; the Thor's printed labels are Nintendo style.
pad.cross=a
pad.circle=b
pad.square=x
pad.triangle=y
pad.l1=leftshoulder
pad.r1=rightshoulder
pad.l2=lefttrigger
pad.r2=righttrigger
pad.l3=leftstick
pad.r3=rightstick
pad.options=start
pad.touchpad=back
pad.up=dpup
pad.down=dpdown
pad.left=dpleft
pad.right=dpright
