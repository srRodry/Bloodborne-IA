name: SM8475 sanity

on:
  push:
    branches:
      - feature/edge30-ultra-sm8475
  pull_request:
    paths:
      - "tools/android/**"
      - "src/probe.c"
      - "src/runtime.h"
      - "src/runtime_file.c"
      - "scripts/game_check.py"
      - "tests/test_game_check.py"
      - "tests/test_file_mods.c"
      - ".github/workflows/sm8475-sanity.yml"

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android launcher shell
        run: |
          dash -n tools/android/run-thor.sh
          for script in tools/android/bootstrap_build_deps.sh tools/android/build_arm64.sh \
                        tools/android/build_frontend.sh tools/android/build_lsfg.sh \
                        tools/android/build_pkg_tool.sh tools/android/build_release_apk.sh \
                        tools/android/fetch_steam_libs.sh; do
            bash -n "$script"
          done
          ! grep -q 'rg --files' tools/android/build_frontend.sh
          grep -q 'No Android frontend Java sources found' tools/android/build_frontend.sh

      - name: Validate Python build scripts
        run: |
          python3 -m py_compile tools/android/build_release_runtime.py tools/android/bootstrap_release_rootfs.py \
            tools/android/build_arm64_bundle.py tools/android/build_thor_patch_parts.py scripts/game_check.py

      - name: Validate Bloodborne game-data checks
        run: |
          python3 -m unittest discover -s tests -p 'test_game_check.py'
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -I. -Isrc tests/test_file_mods.c -o /tmp/file-mods-test
          /tmp/file-mods-test

      - name: Validate FEX profiles
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          profiles = {
              "fast": Path("tools/android/fex-compatible.json"),
              "balanced": Path("tools/android/fex-balanced.json"),
              "stable": Path("tools/android/fex-stable.json"),
          }
          required = {
              "TSOEnabled", "VectorTSOEnabled", "MemcpySetTSOEnabled",
              "HalfBarrierTSOEnabled", "X87ReducedPrecision", "Multiblock",
              "DisableL2Cache", "DynamicL1Cache", "DiskCache",
          }
          for name, path in profiles.items():
              config = json.loads(path.read_text())["Config"]
              missing = required - config.keys()
              assert not missing, f"{name}: missing {sorted(missing)}"
          assert json.loads(profiles["fast"].read_text())["Config"]["TSOEnabled"] == "0"
          assert json.loads(profiles["balanced"].read_text())["Config"]["TSOEnabled"] == "1"
          assert json.loads(profiles["stable"].read_text())["Config"]["X87ReducedPrecision"] == "0"
          PY

      - name: Check device-aware settings and crash diagnostics
        run: |
          grep -q 'fex_profile=balanced' tools/android/thor.ini
          grep -q 'gpu_power=auto' tools/android/thor.ini
          grep -q 'FEX_PROFILE_VALUES' tools/android/frontend/src/ro/cobrabm/fexdroid/SettingsDialog.java
          grep -q 'cpuMaxFreqKHz' tools/android/frontend/src/ro/cobrabm/fexdroid/SettingsDialog.java
          grep -q 'BB_GC_IDLE_SECONDS=.*20' tools/android/run-thor.sh
          grep -q 'BB_VRAM_IDLE_SECONDS=.*20' tools/android/run-thor.sh
          grep -q 'export BB_GC_BUDGET_MB BB_GC_IDLE_SECONDS BB_VRAM_IDLE_SECONDS' tools/android/run-thor.sh
          grep -q 'case 11: return "SIGSEGV"' tools/android/frontend/src/ro/cobrabm/fexdroid/MainActivity.java
          grep -q 'Game profile:' tools/android/frontend/src/ro/cobrabm/fexdroid/MainActivity.java
          grep -q 'const char \*original_game=getenv("BB_GAME_DIR")' src/probe.c
          grep -q 'using original' src/probe.c
          grep -q 'GAME CHECK FAILED:' tools/android/prepare_game.py
          grep -q 'detail.startsWith("GAME CHECK FAILED:")' tools/android/frontend/src/ro/cobrabm/fexdroid/MainActivity.java
          grep -q 'android:versionCode="21"' tools/android/frontend/AndroidManifest.xml
          grep -q 'android:versionName="0.8.4-sm8475-dev4"' tools/android/frontend/AndroidManifest.xml


  bootstrap-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Recreate pinned Android rootfs
        run: python3 tools/android/bootstrap_release_rootfs.py

      - name: Verify reconstructed inputs
        run: |
          test -x .local-deps/android/migration/x/rootfs/usr/bin/FEX
          test -x .local-deps/android/migration/x/rootfs/usr/bin/Xvfb
          test -f .local-deps/android/migration/x/rootfs/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so
          test -s .local-deps/android/device-libs.txt
          test -d .local-deps/android/migration/x/bbport/arm64/patch-parts
          test -n "$(find .local-deps/android/migration/x/bbport/arm64/patch-parts -maxdepth 1 -name '*.bin' -print -quit)"
          test -f .local-deps/android/upstream/Bloodborne-0.8.4.apk
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('.local-deps/android/upstream-runtime.json').read_text())
          assert p['apkSha256'] == '6b100906a25b55ba5ac38a9d8191178bda09955d0a469230a15a3de83f4104d9'
          assert len(p['runtimeSha256']) == 64
          assert p['patchParts'].endswith('bbport/arm64/patch-parts')
          root = Path('.local-deps/android/migration/x/rootfs')
          forbidden = {'eboot.bin', 'boot-linked.bin', 'Lossless.dll'}
          found = [x.name for x in root.rglob('*') if x.name in forbidden]
          assert not found, found
          print('runtime', p['runtimeSha256'])
          print('device libs', len(Path('.local-deps/android/device-libs.txt').read_text().splitlines()))
          PY
